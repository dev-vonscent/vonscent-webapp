name: CI

on:
  push:
    branches: [main]
  pull_request:

# Нэг branch дээр дараалсан push хийхэд хуучин ажиллагааг таслана — PR-ийн
# хамгийн сүүлийн commit-ийн хариу л хэрэгтэй, e2e нь runner-ийн цагийг
# нилээд иддэг.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Хурдан шалгалтууд: секундээр биш минутаар хэмжигдэх e2e-г хүлээлгэхгүйгээр
  # PR-д хариу өгнө.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Хувилбарыг package.json-ий `packageManager`-ээс уншина — Node-ийг
      # `.node-version`-оор зангидсантай ижил зарчим. Хоёр газар бичвэл
      # салж, зөвхөн CI (эсвэл зөвхөн Vercel) дээр унадаг алдаа гарна:
      # pnpm 11 нь `pnpm.overrides`-ыг lockfile-д бичихээ больсон ч pnpm 10
      # түүнийг шалгадаг тул яг тэр зөрүү build-ыг унагаж байсан.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # `.node-version`-оос уншина (22.21.0) — CI ба орон нутгийн хувилбар
          # хоёр салж, зөвхөн CI дээр унадаг алдаа гарахгүйн тулд.
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Хайлтын хэвийн болголтын «паритетын цоож» (src/lib/search.test.ts) энд
      # ажиллана. Бодит сан шаарддаг `pnpm check:search-parity` нь CI-д
      # ЗОРИУДААР ороогүй — DATABASE_URL секрет шаардана; TS талын өөрчлөлтийг
      # цоож нь аль хэдийн барина.
      - name: Test
        run: pnpm test

  # E2E нь дотроо `pnpm build && pnpm start` хийдэг (playwright.config.ts) тул
  # хамаагүй урт. `check` унасан үед ажиллуулах нь runner-ийн цаг дэмий үрэх
  # болно.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Хувилбарыг package.json-ий `packageManager`-ээс уншина — Node-ийг
      # `.node-version`-оор зангидсантай ижил зарчим. Хоёр газар бичвэл
      # салж, зөвхөн CI (эсвэл зөвхөн Vercel) дээр унадаг алдаа гарна:
      # pnpm 11 нь `pnpm.overrides`-ыг lockfile-д бичихээ больсон ч pnpm 10
      # түүнийг шалгадаг тул яг тэр зөрүү build-ыг унагаж байсан.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Секрет шаардахгүй: playwright.config.ts нь Supabase env-ийг хоосон
      # болгож DEMO горимд ачаалдаг тул бодит сан, QPay, Resend-д хүрэхгүй.
      # Sentry-ийн source map илгээлт нь SENTRY_AUTH_TOKEN байхгүй үед өөрөө
      # алгасдаг (next.config.ts) тул build ч дамжина.
      - name: E2E tests (demo mode)
        run: pnpm test:e2e

      # `trace: "on-first-retry"` тул унасан тестийн trace нь зөвхөн эндээс
      # авагдана — CI-ийн лог дээр «яагаад унасан» нь харагддаггүй.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
